{{define "contenu"}}

<h2>Rechercher une ville</h2>

<form action="/ville" method="GET">

    <label for="nom">Nom de la ville</label>

    <input
        type="text"
        id="nom"
        name="nom"
        placeholder="Exemple : Marseille"
        value="{{.Nom}}"
        required
    >

    {{if .Erreur}}
        <p class="erreur">{{.Erreur}}</p>
    {{end}}

    <button type="submit">Rechercher</button>

</form>

{{end}}
